name: violon
description: Application d'entrainement au violon - justesse, rythme et repetition variee.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- A ajouter au fur et a mesure, via `flutter pub add <paquet>` ---
  # Volontairement absents pour que le squelette compile et que la CI soit
  # verte des le premier commit, sans risque de conflit de versions.
  #
  # record            : capture micro (flux PCM brut)
  # flutter_svg       : affichage des partitions gravees par Verovio
  # just_audio        : lecture audio / play-along
  # soloud            : moteur audio bas niveau (metronome pre-planifie)
  # shared_preferences: preferences locales
  # drift ou sqflite  : historique des sessions et heatmap

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # A decommenter quand la premiere partition sera gravee (make scores) :
  # un dossier d'assets vide fait echouer le build.
  # assets:
  #   - assets/scores/
